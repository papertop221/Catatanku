name: Catatanku CI

on:
  push:
    branches: [main, 'prd-*', 'wip-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Security, Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Hygiene & privacy static checks
        run: |
          set -euo pipefail
          # Pastikan tidak ada berkas keystore atau kredensial yang ikut ter-commit.
          if git ls-files | grep -E '(keystore\.properties$|\.jks$|\.keystore$)'; then
            echo "::error::Berkas keystore tidak boleh masuk repositori!"
            exit 1
          fi
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'cleartextTrafficPermitted="false"' app/src/main/res/xml/network_security_config.xml
          if grep -q 'REQUEST_INSTALL_PACKAGES' app/src/main/AndroidManifest.xml; then
            echo "::error::Izin REQUEST_INSTALL_PACKAGES tidak boleh ada!"
            exit 1
          fi

      - name: Verify zero proprietary SDKs in release dependency graph
        run: |
          set -euo pipefail
          DEPS=$(./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon)
          if echo "$DEPS" | grep -iE '(com\.google\.android\.gms|com\.google\.firebase|com\.google\.mlkit|com\.google\.android\.play|crashlytics|appsflyer|adjust)'; then
            echo "::error::Ketergantungan tertutup/pelacak terdeteksi pada releaseRuntimeClasspath!"
            exit 1
          fi

      - name: Compile Kotlin (debug, release, unit tests) & Lint
        run: ./gradlew compileDebugKotlin compileReleaseKotlin compileDebugUnitTestKotlin lintRelease --no-daemon

      - name: Upload Lint report on failure or inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore

      - name: Run JVM & Robolectric unit tests
        run: |
          ./gradlew testDebugUnitTest \
            --tests '*SearchEngineTest*' \
            --tests '*AiTextTest*' \
            --tests '*TimeParseTest*' \
            --tests '*AgentTest*' \
            --tests '*BackupArchiveTest*' \
            --tests '*PerformanceAndMemoryTest*' \
            --tests '*HybridSearchTest*' \
            --tests '*AiQualityTest*' \
            --tests '*ReminderTest*' \
            --no-daemon

      - name: Run search benchmark sanity check (PerfTest)
        run: ./gradlew testDebugUnitTest --tests '*PerfTest*' -Pperf=true -i --no-daemon

      - name: Build release APK (R8 + resource shrinking)
        run: ./gradlew assembleRelease --no-daemon
